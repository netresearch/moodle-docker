worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # A TLS-terminating proxy speaks HTTP to this container, so $https is empty
    # and PHP would see an http request for an https site. The forwarded scheme
    # is what still says https, so it decides HTTPS and SERVER_PORT below.
    #
    # Moodle also corrects both itself once $CFG->sslproxy is on, but only
    # inside initialise_fullme(). Reporting the real scheme here keeps PHP
    # right before that point, for anything reading $_SERVER directly, and for
    # an install that has the flag off - it then still sees https and skips the
    # wwwroot-mismatch redirect instead of bouncing the request.
    #
    # This makes X-Forwarded-Proto trusted input. Behind a proxy that holds:
    # Traefik sets the header on every request, and the Traefik overlay drops
    # the published host ports (ports: !reset []), so nothing else reaches
    # nginx. The base Compose stack does publish port 80, and a client reaching
    # it directly can send the header itself - that misleads Moodle about the
    # spoofer's own session, so do not publish those ports on a host that also
    # sits behind a proxy.
    map $http_x_forwarded_proto $fcgi_https {
        default $https;
        https   on;
    }

    # Moodle compares the request port against wwwroot whenever wwwroot names
    # an explicit one, and redirects to wwwroot when they differ - which loops
    # if every request keeps reporting the wrong port.
    #
    # $server_port is the port nginx listens on inside the container, not the
    # one the client addressed, so publishing as 8080:80 breaks that comparison
    # for a wwwroot of http://host:8080. The Host header carries what the client
    # asked for, and Moodle already takes the host from it, so the port comes
    # from there too. Both forms, with and without brackets around an IPv6
    # address; a Host without a port falls through to the listening port.
    map $http_host $port_from_host {
        default              $server_port;
        "~^[^:\[]+:(\d+)$"   $1;
        "~^\[[^\]]+\]:(\d+)$" $1;
    }

    # A forwarded https request must report 443 regardless of the port it
    # arrived on.
    map $http_x_forwarded_proto $fcgi_port {
        default $port_from_host;
        https   443;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Brotli compression (preferred over gzip)
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript
                 text/xml application/xml application/xml+rss text/javascript
                 image/svg+xml application/x-javascript application/xhtml+xml;

    # Gzip fallback for older clients
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/xhtml+xml;

    # PHP-FPM upstream
    upstream php-fpm {
        server moodle:9000;
    }

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        listen 443 ssl;
        listen 443 quic reuseport;
        http2 on;

        server_name _;

        # SSL certificates (self-signed for dev, mount real certs for prod)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Advertise HTTP/3 support
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        # Since Moodle 5.0: /public is the document root
        root /var/www/html/public;
        index index.php index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Max upload size (match PHP settings)
        client_max_body_size 100M;

        # PHP - proxy to PHP-FPM.
        #
        # This block must stay above the static-asset block: nginx takes the
        # first matching regex location, and a script like theme/styles.php
        # would otherwise be served as a file by the .css rule.
        location ~ [^/]\.php(/|$) {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            # try_files rewrites $uri on a match, which re-runs the split above
            # and loses the slash arguments Moodle reads from PATH_INFO. Keep
            # them first.
            set $saved_path_info $fastcgi_path_info;

            # Some routed paths end in .php without being a file - Moodle's shim
            # routes, /lib/exampleshimroute2.php among them. This location wins
            # over "location /" for those, so the router fallback has to be
            # repeated here or they would answer 404.
            try_files $fastcgi_script_name /r.php$is_args$args;

            fastcgi_pass php-fpm;
            fastcgi_index index.php;

            # fastcgi_params first: it sets SERVER_PORT unconditionally, so an
            # override placed above it is simply overwritten and the map that
            # feeds it never reaches PHP.
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $saved_path_info;
            fastcgi_param HTTPS $fcgi_https if_not_empty;
            fastcgi_param SERVER_PORT $fcgi_port;

            # Timeouts for long-running scripts
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_connect_timeout 60;

            # Buffering
            fastcgi_buffering on;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 16 16k;
        }


        # Static files - serve directly with a long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Alt-Svc 'h3=":443"; ma=86400';
            try_files $uri =404;

            # Serve pre-compressed files if available
            gzip_static on;
            brotli_static on;
        }

        # Default location.
        #
        # Anything that is not a real file goes to r.php, Moodle's router. The
        # rewrite is internal, so REQUEST_URI keeps the routed path and the
        # router reads it from there.
        #
        # This and $CFG->routerconfigured are one setting in two places and
        # only work together. With the flag off, the router prefixes its own
        # base path with /r.php and then no longer matches the unprefixed
        # request, so this rewrite alone answers 404; with the flag on but no
        # rewrite, Moodle emits unprefixed URLs that never reach the router.
        # ROUTER_CONFIGURED drives the flag and defaults to true, which is
        # correct for this stack because it ships both images together.
        location / {
            try_files $uri $uri/ /r.php$is_args$args;
        }

        # Moodle dataroot protection (should never be web-accessible)
        location ~ ^/moodledata {
            internal;
        }

        # Block access to sensitive files
        location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf)$ {
            deny all;
        }

        # Mailpit proxy (optional, graceful failure if not running)
        location /mailpit/ {
            set $mailpit_upstream http://mailpit:8025;
            proxy_pass $mailpit_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 502 503 504 = @mailpit_unavailable;
        }

        location @mailpit_unavailable {
            default_type text/html;
            return 503 '<!DOCTYPE html><html><head><title>Mailpit Unavailable</title></head><body><h1>Mailpit not available</h1><p>Start the mailpit service with: <code>docker compose --profile dev up -d</code></p></body></html>';
        }

        # Health check endpoint for load balancers
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # PHP-FPM status (internal only)
        location /fpm-status {
            internal;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
            include fastcgi_params;
        }
    }
}
