# Traefik Override Configuration
# Usage: docker compose -f compose.yml -f compose.traefik.yml up -d
# Or: make start-traefik
#
# The labels belong to nginx, not to the moodle service: moodle runs PHP-FPM
# and listens on 9000, so a router pointing at port 80 there has nothing to
# talk to. nginx is the service that serves HTTP.
#
# Entrypoint and certresolver names differ per Traefik installation - set
# TRAEFIK_ENTRYPOINT, TRAEFIK_CERTRESOLVER and TRAEFIK_NETWORK to match yours.

services:
  nginx:
    # Traefik terminates TLS and routes to this container, so it must not bind
    # host ports itself.
    ports: !reset []

    labels:
      traefik.enable: "true"

      # HTTPS router
      traefik.http.routers.moodle.rule: "Host(`${MOODLE_DOMAIN:-moodle.localhost}`)"
      traefik.http.routers.moodle.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.moodle.tls: "true"
      traefik.http.routers.moodle.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      traefik.http.services.moodle.loadbalancer.server.port: "80"

      # HTTP to HTTPS redirect
      traefik.http.routers.moodle-http.rule: "Host(`${MOODLE_DOMAIN:-moodle.localhost}`)"
      traefik.http.routers.moodle-http.entrypoints: "${TRAEFIK_ENTRYPOINT_HTTP:-web}"
      traefik.http.routers.moodle-http.middlewares: "moodle-redirect"
      traefik.http.middlewares.moodle-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.moodle-redirect.redirectscheme.permanent: "true"

    networks:
      - frontend
      - backend
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
