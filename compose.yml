# Moodle 5.2 Production Stack
# PHP-FPM + nginx + MariaDB 12.3 (hardened) + Valkey 9 + Ofelia + Mailpit

services:
  # ==========================================================================
  # nginx - Web Server
  # ==========================================================================
  nginx:
    image: netresearch/moodle-nginx:latest
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-moodle}_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443/tcp"
      - "${HTTPS_PORT:-443}:443/udp"  # HTTP/3 QUIC
    volumes:
      - moodle_code:/var/www/html:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend
      - backend
    depends_on:
      moodle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Moodle - PHP-FPM Application
  # ==========================================================================
  moodle:
    image: netresearch/moodle:${MOODLE_VERSION:-5.2.3}
    build:
      context: ./docker/moodle
      dockerfile: Dockerfile
      args:
        MOODLE_VERSION: ${MOODLE_VERSION:-5.2.3}
    container_name: ${COMPOSE_PROJECT_NAME:-moodle}_app
    restart: unless-stopped
    volumes:
      - moodle_code:/var/www/html
      - moodledata:/var/moodledata
    environment:
      - MOODLE_VERSION=${MOODLE_VERSION:-5.2.3}
      - MOODLE_URL=${MOODLE_URL:-http://localhost}
      - DB_TYPE=${DB_TYPE:-mariadb}
      - DB_HOST=${DB_HOST:-database}
      - DB_NAME=${DB_NAME:-moodle}
      - DB_USER=${DB_USER:-moodle}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_PREFIX=${DB_PREFIX:-mdl_}
      - VALKEY_HOST=${VALKEY_HOST:-valkey}
      - VALKEY_PORT=${VALKEY_PORT:-6379}
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_NOREPLY=${SMTP_NOREPLY:-noreply@example.com}
      - SSL_PROXY=${SSL_PROXY:-false}
      - REVERSE_PROXY=${REVERSE_PROXY:-false}
      - ROUTER_CONFIGURED=${ROUTER_CONFIGURED:-true}
      - MOODLE_AUTO_UPGRADE=${MOODLE_AUTO_UPGRADE:-true}
      - MOODLE_DEBUG=${MOODLE_DEBUG:-false}
    networks:
      - frontend  # Outbound access for Moodle itself (plugin updates, external services)
      - backend
    depends_on:
      database:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # Init container: the hardened database image acts on MARIADB_ROOT_PASSWORD
    # only and creates neither database nor user, and it offers no
    # /docker-entrypoint-initdb.d. This runs once before the service starts,
    # in the database image because the PHP image carries no client.
    # Idempotent, so repeated starts are harmless.
    pre_start:
      - image: dhi.io/mariadb:12.3
        environment:
          - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
          - DB_NAME=${DB_NAME:-moodle}
          - DB_USER=${DB_USER:-moodle}
          - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            # Identifiers cannot be parameterised, so reject anything that would
            # break out of the quoting instead of interpolating it blindly.
            case "$$DB_NAME$$DB_USER" in
              *[!A-Za-z0-9_-]*) echo "DB_NAME and DB_USER may only contain A-Z a-z 0-9 _ -" >&2; exit 1 ;;
            esac
            # Single quotes are the only metacharacter inside a SQL string literal.
            esc_pw=$$(printf '%s' "$$DB_PASSWORD" | sed "s/'/''/g")
            mariadb -h database -u root -p"$$MARIADB_ROOT_PASSWORD" \
              -e "CREATE DATABASE IF NOT EXISTS \`$$DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
                  CREATE USER IF NOT EXISTS '$$DB_USER'@'%' IDENTIFIED BY '$$esc_pw';
                  ALTER USER '$$DB_USER'@'%' IDENTIFIED BY '$$esc_pw';
                  GRANT ALL PRIVILEGES ON \`$$DB_NAME\`.* TO '$$DB_USER'@'%';
                  FLUSH PRIVILEGES;"
            echo "database and user ready"
    # Cron runs in this container rather than a dedicated one. Ofelia's
    # job-exec needs a running container, and this one runs anyway; a separate
    # service would have to sit in `sleep infinity` doing nothing. job-run
    # would avoid the idle container too, but it needs every volume, network
    # and environment variable repeated in labels - a second copy of the
    # service definition that drifts.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.moodle-cron.schedule: "@every 1m"
      ofelia.job-exec.moodle-cron.command: "php /var/www/html/admin/cli/cron.php"
      ofelia.job-exec.moodle-cron.user: "www-data"
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start copies the sources into the code volume and then runs
      # the database upgrade, which on a large site takes minutes.
      start_period: 600s

  # ==========================================================================
  # MariaDB 12.3 - Database (Docker Hardened Image)
  #
  # The hardened image runs as non-root (uid 65532) and ships no my.cnf, so the
  # tuning file is mounted at /etc/my.cnf - the first path the server reads.
  # There is no conf.d include, and it honours only MARIADB_ROOT_PASSWORD; it
  # creates neither database nor user - the pre_start hook on moodle does that.
  # ==========================================================================
  database:
    image: dhi.io/mariadb:12.3
    container_name: ${COMPOSE_PROJECT_NAME:-moodle}_database
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/custom.cnf:/etc/my.cnf:ro
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Valkey 9 - Redis-Compatible Cache & Sessions
  # ==========================================================================
  valkey:
    image: valkey/valkey:9-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-moodle}_valkey
    restart: unless-stopped
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - valkey_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "--no-auth-warning", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # Ofelia - Cron Scheduler
  # ==========================================================================
  ofelia:
    image: ghcr.io/netresearch/ofelia:1.0.0
    container_name: ${COMPOSE_PROJECT_NAME:-moodle}_ofelia
    restart: unless-stopped
    command: daemon
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    depends_on:
      - moodle

  # ==========================================================================
  # Mailpit - Development Mail Catcher (Optional)
  # ==========================================================================
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: ${COMPOSE_PROJECT_NAME:-moodle}_mailpit
    restart: unless-stopped
    profiles:
      - dev
      - mail
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 30s
      timeout: 5s
      retries: 3

# =============================================================================
# Networks
# =============================================================================
networks:
  frontend:
    name: ${COMPOSE_PROJECT_NAME:-moodle}_frontend
  backend:
    name: ${COMPOSE_PROJECT_NAME:-moodle}_backend
    internal: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  moodle_code:
    name: ${COMPOSE_PROJECT_NAME:-moodle}_code
  moodledata:
    name: ${COMPOSE_PROJECT_NAME:-moodle}_data
  db_data:
    name: ${COMPOSE_PROJECT_NAME:-moodle}_db
  valkey_data:
    name: ${COMPOSE_PROJECT_NAME:-moodle}_valkey
