name: Docker Build & Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly security rebuild
  workflow_dispatch:

env:
  MOODLE_VERSION: "5.3.0"

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create test .env file
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_SECURE_PASSWORD/test_password_123/g' .env
          sed -i 's/CHANGE_ME_SECURE_ROOT_PASSWORD/test_root_456/g' .env
          sed -i 's/CHANGE_ME_SECURE_VALKEY_PASSWORD/test_valkey_789/g' .env

      # The runner image ships an older compose than deployments run, and it
      # rejects keys current compose accepts (pre_start among them). Validate
      # against current compose, not against the runner's.
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: latest

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose version
          docker compose config > /dev/null
          echo "Docker Compose syntax is valid"

      - name: Check required files
        run: |
          files=(".env.example" "compose.yml" "docker/moodle/Dockerfile" "docker/moodle/entrypoint.sh" "docker/nginx/Dockerfile" "docker/nginx/nginx.conf")
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Verify .gitignore excludes secrets
        run: |
          if grep -q "^\.env$" .gitignore && grep -q "docker/nginx/ssl/\*\.pem$" .gitignore; then
            echo ".gitignore properly configured"
          else
            echo ".gitignore missing critical entries"
            exit 1
          fi

      - name: Check for leaked secrets
        run: |
          # Exclude files that legitimately contain placeholder references:
          # - .env.example: Template file with placeholders
          # - .github/workflows/: CI workflows that reference placeholders
          # - Documentation files that reference .env.example
          EXCLUDE_PATTERN=".env.example|.github/workflows/|Makefile|README.md|QUICKSTART.md|docs/"
          if git ls-files | xargs grep -l "CHANGE_ME" | grep -vE "$EXCLUDE_PATTERN"; then
            echo "Found placeholder passwords in tracked files"
            exit 1
          fi
          echo "No leaked secrets detected"

  # The checks below run against images built from docker-bake.hcl, the same
  # definition the `publish` job pushes. They read the GHA cache that `publish`
  # writes per target (scope = target name) and skip it on the weekly rebuild,
  # so that they check the image that run publishes.
  test-moodle-image:
    name: Test Moodle Image
    runs-on: ubuntu-latest
    needs: validate-compose
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build test image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: moodle-test
          no-cache: ${{ github.event_name == 'schedule' }}
          set: moodle-test.cache-from=type=gha,scope=moodle

      - name: Verify PHP version
        run: |
          # Override entrypoint to run PHP directly
          PHP_VERSION=$(docker run --rm --entrypoint php moodle:test -v | head -n 1)
          echo "PHP Version: $PHP_VERSION"
          if echo "$PHP_VERSION" | grep -q "PHP 8.4"; then
            echo "PHP 8.4 verified"
          else
            echo "Expected PHP 8.4"
            exit 1
          fi

      - name: Verify required PHP extensions
        run: |
          REQUIRED_EXTS="sodium mysqli gd intl zip redis ldap mbstring xml"
          for ext in $REQUIRED_EXTS; do
            if docker run --rm --entrypoint php moodle:test -m | grep -q "^$ext$"; then
              echo "Extension found: $ext"
            else
              echo "Missing required extension: $ext"
              exit 1
            fi
          done

          # OPcache shows as "Zend OPcache" in php -m output
          if docker run --rm --entrypoint php moodle:test -m | grep -q "Zend OPcache"; then
            echo "Extension found: opcache (Zend OPcache)"
          else
            echo "Missing required extension: opcache"
            exit 1
          fi

      - name: Check PHP configuration
        run: |
          docker run --rm --entrypoint php moodle:test -i | grep -E "max_input_vars|memory_limit|upload_max_filesize"

          # Verify max_input_vars >= 5000
          MAX_INPUT_VARS=$(docker run --rm --entrypoint php moodle:test -r "echo ini_get('max_input_vars');")
          if [ "$MAX_INPUT_VARS" -ge 5000 ]; then
            echo "max_input_vars = $MAX_INPUT_VARS (>= 5000)"
          else
            echo "max_input_vars = $MAX_INPUT_VARS (need >= 5000)"
            exit 1
          fi

  test-nginx-image:
    name: Test Nginx Image
    runs-on: ubuntu-latest
    needs: validate-compose
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build test image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: nginx-test
          no-cache: ${{ github.event_name == 'schedule' }}
          set: nginx-test.cache-from=type=gha,scope=nginx

      - name: Verify Nginx configuration
        run: |
          # Test nginx config syntax
          # Note: nginx -t fails with "host not found in upstream" because moodle container isn't running
          # Use --add-host to provide a fake DNS resolution for the upstream
          docker run --rm --add-host moodle:127.0.0.1 moodle-nginx:test nginx -t
          echo "Nginx configuration is valid"

      - name: Verify Brotli module
        run: |
          # Check brotli module is loaded
          if docker run --rm moodle-nginx:test nginx -V 2>&1 | grep -q "brotli"; then
            echo "Brotli module verified"
          else
            # Check if module files exist
            docker run --rm moodle-nginx:test ls -la /usr/lib/nginx/modules/ | grep brotli
            echo "Brotli modules present"
          fi

  test-stack-startup:
    name: Test Stack Startup
    runs-on: ubuntu-latest
    needs: [test-moodle-image, test-nginx-image]
    # Pull requests from forks cannot read repository secrets, so they could
    # never pull the hardened database image. Skip rather than fail them.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The hardened MariaDB image lives on dhi.io, which needs a login. Without
      # the secrets the pull fails, so fail here with a clear message rather
      # than inside `compose up`, where it reads as an unhealthy container.
      # Secrets reach the script through env, never expanded into the run
      # block itself, where they would end up in the rendered command line.
      - name: Check dhi.io credentials
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "${DHI_USERNAME:-}" ] || [ -z "${DHI_TOKEN:-}" ]; then
            echo "::error::Repository secrets DHI_USERNAME and DHI_TOKEN are required to pull dhi.io/mariadb"
            exit 1
          fi

      - name: Log in to dhi.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Create .env file
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_SECURE_PASSWORD/test_password_123/g' .env
          sed -i 's/CHANGE_ME_SECURE_ROOT_PASSWORD/test_root_456/g' .env
          sed -i 's/CHANGE_ME_SECURE_VALKEY_PASSWORD/test_valkey_789/g' .env

      - name: Generate SSL certificates
        run: |
          mkdir -p docker/nginx/ssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout docker/nginx/ssl/key.pem \
            -out docker/nginx/ssl/cert.pem \
            -subj "/CN=localhost/O=CI Test/C=US"

      # Same reason as in validate-compose: compose.yml uses keys the runner's
      # preinstalled version does not know.
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: latest

      - name: Build and start services
        run: |
          docker compose version
          docker compose build --no-cache
          docker compose up -d
          echo "Services started"

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          # The sources ship in the image, so startup only copies them into the
          # code volume - no download to wait for.
          timeout 300 bash -c 'until docker compose ps moodle | grep -q "healthy"; do sleep 10; echo "Waiting..."; docker compose ps; done'
          docker compose ps
          echo "Services are healthy"

      - name: Check service health
        run: |
          services=("moodle" "nginx" "database" "valkey")
          for service in "${services[@]}"; do
            if docker compose ps "$service" | grep -q "Up"; then
              echo "$service is running"
            else
              echo "$service is not running"
              docker compose logs "$service"
              exit 1
            fi
          done

      - name: Test web access
        run: |
          sleep 15  # Give services time to settle
          # Test via nginx (port 80)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "303" ]; then
            echo "Moodle web access working (HTTP $HTTP_CODE)"
          else
            echo "Moodle web access failed (HTTP $HTTP_CODE)"
            docker compose logs nginx
            docker compose logs moodle
            exit 1
          fi

      # Moodle 5.3 serves its ES modules through the router, under .js paths
      # that are not files. nginx has to hand those to PHP; answering them with
      # its own 404 breaks the JavaScript on every page while the HTML still
      # loads, so the check above cannot see it. X-Powered-By tells who
      # answered - the status alone does not.
      - name: Test that module URLs reach the router
        run: |
          module=$(curl -s -o /dev/null -D - http://localhost/core/esm/0/bootstrap/bootstrap.js)
          echo "$module"
          if ! echo "$module" | grep -qi '^x-powered-by: PHP'; then
            echo "A .js path that is not a file was not handed to PHP"
            exit 1
          fi
          static=$(curl -s -o /dev/null -D - http://localhost/lib/requirejs/require.min.js)
          echo "$static"
          # nginx's own 404 carries no X-Powered-By either, so the status
          # has to be checked too.
          if ! echo "$static" | head -n 1 | grep -q ' 200'; then
            echo "A real static file did not answer 200"
            exit 1
          fi
          if echo "$static" | grep -qi '^x-powered-by'; then
            echo "A real static file went to PHP instead of being served by nginx"
            exit 1
          fi

      - name: Test database connection
        run: |
          docker compose exec -T database mariadb -uroot -ptest_root_456 -e "SHOW DATABASES;" | grep -q "moodle"
          echo "Database connection working"

      - name: Test Valkey connection
        run: |
          docker compose exec -T valkey valkey-cli -a test_valkey_789 PING | grep -q "PONG"
          echo "Valkey connection working"

      - name: Test Ofelia cron
        run: |
          sleep 65  # Wait for cron to run at least once
          if docker compose logs ofelia | grep -q "Job executed"; then
            echo "Ofelia cron is executing"
          else
            echo "Warning: Ofelia cron not executed yet (may need more time)"
            docker compose logs ofelia
          fi

      - name: Show service logs
        if: always()
        run: |
          echo "=== Moodle Logs ==="
          docker compose logs --tail=50 moodle
          echo "=== Nginx Logs ==="
          docker compose logs --tail=50 nginx
          echo "=== Database Logs ==="
          docker compose logs --tail=50 database
          echo "=== Valkey Logs ==="
          docker compose logs --tail=50 valkey
          echo "=== Ofelia Logs ==="
          docker compose logs --tail=50 ofelia

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

  # Builds both images from docker-bake.hcl through the shared reusable and
  # pushes them only after the checks above passed. On a pull request it loads
  # them instead of pushing, so Trivy can still scan them. Trivy is
  # report-only: findings go to code scanning and do not fail the run.
  publish:
    name: Build and Push
    needs: [test-moodle-image, test-nginx-image, test-stack-startup]
    # test-stack-startup is skipped on fork pull requests; a skipped job must
    # not skip this one.
    if: ${{ !failure() && !cancelled() }}
    uses: netresearch/.github/.github/workflows/build-container-bake.yml@main
    # security-events: write is consumed by the Trivy SARIF upload, and the
    # reusable's job declares all four: a caller granting less cannot start it.
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    with:
      bake-file: docker-bake.hcl
      # The pre-build-command sets the tag variables in the runner, which only
      # a local build context sees.
      bake-source: "."
      targets: moodle,nginx
      push: ${{ github.event_name != 'pull_request' }}
      load: ${{ github.event_name == 'pull_request' }}
      scan: true
      # The weekly run exists to pick up a rebuilt base image and current
      # Alpine packages. With the layer cache on, every layer is restored
      # from the previous build and the same image is published again.
      cache: ${{ github.event_name != 'schedule' }}
      # Tags as before the move to bake: branch name (pr-<n> on a pull
      # request), sha-<7 characters> and latest on main.
      pre-build-command: |
        if [[ "$GITHUB_REF" == refs/pull/* ]]; then
          ref_tag="pr-$(cut -d/ -f3 <<< "$GITHUB_REF")"
          sha=""
        else
          ref_tag="$(sed 's/[^A-Za-z0-9._-]/-/g' <<< "$GITHUB_REF_NAME")"
          sha="$GITHUB_SHA"
        fi
        latest=false
        if [[ "$GITHUB_REF" == refs/heads/main ]]; then
          latest=true
        fi
        {
          echo "REF_TAG=$ref_tag"
          echo "GIT_SHA=$sha"
          echo "LATEST=$latest"
        } >> "$GITHUB_ENV"

  # Markdown lint via the org's shared reusable, so the pinned action is
  # maintained centrally. Scope + blocking behaviour preserved (root *.md,
  # strict).
  markdown-lint:
    name: Markdown Lint
    uses: netresearch/.github/.github/workflows/lint-markdown.yml@main
    permissions:
      contents: read
    with:
      globs: '*.md'
      strict: true
